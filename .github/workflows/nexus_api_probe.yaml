name: Nexus API probe

# Run by hand from the Actions tab. Finds out what the Nexus v3 API lets an author change on files already
# released: the changelog entries and the file versions' descriptions. "read" only reads (GET, and OPTIONS for the
# methods each path allows). Nothing here runs on a push or a tag.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read: GET and OPTIONS only"
        type: choice
        options: [read]
        default: read

env:
  NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
  API: https://api.nexusmods.com/v3
  FILE_CHAIN: "2608471"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read
        run: |
          call() {  # method path
            echo "::group::$1 $2"
            curl -sS -X "$1" -D - -o body.json -H "apikey: $NEXUSMODS_API_KEY" -H "User-Agent: mod_settings-api-probe" \
              -H "Accept: application/json" "$API$2" | grep -i -E '^(HTTP|allow|access-control-allow-methods)' || true
            head -c 6000 body.json; echo
            echo "::endgroup::"
          }
          mod=$(curl -sS -H "apikey: $NEXUSMODS_API_KEY" -H "User-Agent: mod_settings-api-probe" \
            "$API/games/cyberpunk2077/mods/4885" | jq -r .data.id)
          echo "mod 4885 -> v3 id $mod"
          call GET "/games/cyberpunk2077/mods/4885"
          call GET "/mods/$mod"
          call GET "/mods/$mod/changelogs"
          call GET "/mods/$mod/files"
          call GET "/mod-files/$FILE_CHAIN"
          call GET "/mod-files/$FILE_CHAIN/versions"
          for p in "/mods/$mod/changelogs" "/mod-files/$FILE_CHAIN" "/mod-files/$FILE_CHAIN/versions"; do
            call OPTIONS "$p"
          done
